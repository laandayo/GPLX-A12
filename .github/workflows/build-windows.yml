name: Build Windows and Android releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 release
    runs-on: windows-latest
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      GPLX_RELEASE_REPOSITORY: ${{ vars.GPLX_RELEASE_REPOSITORY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Android release signing
        if: env.HAS_ANDROID_SIGNING == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes('android/app/upload-keystore.jks', [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          @"
          storePassword=$env:ANDROID_STORE_PASSWORD
          keyPassword=$env:ANDROID_KEY_PASSWORD
          keyAlias=$env:ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          "@ | Set-Content android/key.properties

      - name: Create temporary Android signing for build artifacts
        if: env.HAS_ANDROID_SIGNING != 'true'
        shell: pwsh
        run: |
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -storepass android -alias gplx-temporary -keypass android -dname "CN=GPLX temporary build, O=GPLX, C=VN" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          @"
          storePassword=android
          keyPassword=android
          keyAlias=gplx-temporary
          storeFile=upload-keystore.jks
          "@ | Set-Content android/key.properties

      - name: Require Android signing for a public release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_ANDROID_SIGNING != 'true'
        shell: pwsh
        run: throw 'Configure Android signing secrets before publishing a tagged release.'

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        if: env.HAS_ANDROID_SIGNING == 'true'
        run: flutter build appbundle --release

      - name: Name Android APK
        shell: pwsh
        run: |
          Copy-Item build\app\outputs\flutter-apk\app-release.apk GPLX-Android.apk

      - name: Name signed Android App Bundle
        if: env.HAS_ANDROID_SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item build\app\outputs\bundle\release\app-release.aab GPLX-Android.aab

      - name: Build Windows release
        shell: pwsh
        run: |
          if ($env:GPLX_RELEASE_REPOSITORY) {
            flutter build windows --release "--dart-define=GPLX_UPDATE_REPOSITORY=$env:GPLX_RELEASE_REPOSITORY"
          } else {
            flutter build windows --release
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1).Matches.Groups[1].Value
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" installer\gplx.iss

      - name: Package release folder
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath GPLX-Windows-x64.zip

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: GPLX-Windows-x64
          path: GPLX-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GPLX-Android-APK
          path: GPLX-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android App Bundle
        if: env.HAS_ANDROID_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GPLX-Android-AAB
          path: GPLX-Android.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GPLX-Windows-x64-Setup
          path: build\windows-installer\GPLX-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @('build\windows-installer\GPLX-Windows-x64-Setup.exe', 'GPLX-Windows-x64.zip', 'GPLX-Android.apk', 'GPLX-Android.aab')
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --generate-notes --title "GPLX Windows $tag"
          }
